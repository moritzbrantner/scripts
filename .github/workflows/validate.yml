name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: merge-ready
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Compile
        run: python -m compileall sync_github_repos.py workspace_environment_inventory.py repo_ops.py repo_ops_base.py repo_ops_checks.py repo_ops_analysis.py repo_ops_remote.py repo_ops_mutation.py tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke CLI aliases
        run: |
          bin/repo-ops --help
          bin/fleet-status --help
      - name: Dogfood workflow pinning
        run: python -c "from pathlib import Path; import repo_ops as r; assert not r.workflow_findings(Path('.'))"
